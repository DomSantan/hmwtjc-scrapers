name: Daily price scrape

on:
  schedule:
    # 00:13 UTC (~1am BST) — deliberately not a round number. GitHub Actions
    # scheduled workflows queued for popular exact times (like the old 2:00)
    # get delayed under platform-wide load; confirmed via run history this was
    # consistently firing 2.5-3.5h late (actual starts 04:39-05:31 UTC despite
    # the declared 2am). An off-the-clock minute avoids that contention.
    # STILL true as of 2026-08-04: every scheduled run over the past 5 nights
    # actually started 03:32-03:49 UTC, a ~3.3h delay from the declared 00:13.
    - cron: '13 0 * * *'
    # 11:17 UTC — second run, for PlasticPipeShop and PlumbingSuperstore only
    # (see CLOUD_STRAGGLER / PI_STRAGGLER below). Both suppliers fail hard
    # every night in the ~03:30-04:00 UTC window the main run's first requests
    # land in (see above — that's the *actual* start time, not the declared
    # 00:13), on two completely different network origins (GitHub cloud vs.
    # the residential Optiplex), yet pass cleanly every time they're run in
    # isolation outside that window — including a manual test at ~11:20 UTC
    # that ran PlumbingSuperstore's full 8h crawl with zero blocks. Time-of-
    # night-specific blocking, cause unconfirmed; this is a scheduling
    # workaround, not a root-cause fix. 11:17 chosen to land close to that
    # proven-safe precedent while staying off a round number.
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated scrapers to run (e.g. GrantAndStone,Wickes). Leave empty for all.'
        required: false
        default: ''

# ── Cloud job ──────────────────────────────────────────────────────────────────
# Runs on GitHub-hosted runners — unaffected by Pi downtime.
# Suppliers: BoilerSparesUK, DrainageCentral, DrainageFittings, Geberit,
#            PipeDreamFittings, Screwfix, VictorianPlumbing, Wavin,
#            Selco, BetterBathrooms  (main 00:13 run)
#            + PlasticPipeShop (11:17 straggler run only — see CLOUD_STRAGGLER)
# Moved to Pi (rate-limit 202 from cloud IPs): DrainageOnline, DrainageSuperstore, PlumbingSuperstore
# Selco/BetterBathrooms added 2026-07-21 (re-added scraper, small catalogues — see run_daily_update.py)
# PipeKit moved to Pi 2026-07-23 (see below) — same cloud-IP-block pattern as the drainage trio
# PlasticPipeShop split onto its own 11:17 UTC run 2026-08-04 — see the cron
# comment above for why.

jobs:
  scrape-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 4h — longest cloud spider is BoilerSparesUK (~3-4h, varies with site speed)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Scrapy venv
        run: |
          python3 -m venv ScrapeProg/venv
          ScrapeProg/venv/bin/pip install --upgrade pip -q
          ScrapeProg/venv/bin/pip install -r ScrapeProg/requirements.txt -q

      - name: Run cloud scrapers
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p data
          CLOUD_MAIN="BoilerSparesUK,DrainageCentral,DrainageFittings,Geberit,PipeDreamFittings,Screwfix,VictorianPlumbing,Wavin,Selco,BetterBathrooms"
          CLOUD_STRAGGLER="PlasticPipeShop"

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "17 11 * * *" ]; then
              CLOUD_SUPPLIERS="$CLOUD_STRAGGLER"
            else
              CLOUD_SUPPLIERS="$CLOUD_MAIN"
            fi
          else
            CLOUD_SUPPLIERS="$CLOUD_MAIN,$CLOUD_STRAGGLER"
          fi

          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            FILTERED=$(python3 -c "
          only={s.strip() for s in '$ONLY'.split(',')}
          cloud=set('$CLOUD_SUPPLIERS'.split(','))
          result=only & cloud
          print(','.join(result) if result else '')
          ")
            if [ -z "$FILTERED" ]; then
              echo "No cloud suppliers in --only filter — skipping"
              exit 0
            fi
            CLOUD_SUPPLIERS="$FILTERED"
          fi
          python3 ScrapeProg/run_daily_update.py \
            --skip-import \
            --results-file data/scrape_results.json \
            --only "$CLOUD_SUPPLIERS"

# ── Pi job ─────────────────────────────────────────────────────────────────────
# Runs on the Optiplex (residential IP). Fails gracefully if the Optiplex is down —
# cloud job above always completes independently.
# Suppliers: BES, BandQ, CityPlumbing, DrainageOnline, DrainageSuperstore,
#            MaterialsMarket, PlumbNation, Toolstation, Wickes,
#            Wolseley, Jewson, Plumbworld, HeatAndPlumb, PipeKit  (main 00:13 run)
#            + PlumbingSuperstore (11:17 straggler run only — see PI_STRAGGLER)
# (DrainageOnline/DrainageSuperstore/PlumbingSuperstore moved here — cloud IPs get 202)
# PlumbingSuperstore split onto its own 11:17 UTC run 2026-08-04 — see the cron
# comment up top for why. NOTE: the Optiplex's rtcwake wake window needs to
# cover ~11:17 UTC too (plus GitHub's usual queue delay) — check/extend it,
# this workflow change alone doesn't wake the physical machine a second time.
# Wolseley/Jewson/Plumbworld/HeatAndPlumb added 2026-07-21 (re-added scraper, put
# here rather than cloud since their catalogues are large — 14k-42k URLs each —
# and the cloud job's 4h ceiling is already tight at 10 concurrent suppliers;
# Pi's 12h budget already comfortably hosts the other large catalogues)
# PipeKit moved here 2026-07-23 — was failing every night on cloud with a 429 on
# its very first request (confirmed via live test: the exact same URL succeeds
# cleanly from a non-cloud IP, and continues succeeding for ~280 more requests
# before genuinely rate-limiting — the cloud runner's shared IP range is already
# blocked outright, not "trips during the crawl" like the drainage trio was).
# Same fix as the drainage trio above.

  scrape-pi:
    runs-on: [self-hosted, residential]
    timeout-minutes: 720   # 12h — CityPlumbing + Wickes are slow
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Scrapy venv
        run: |
          python3 -m venv ScrapeProg/venv
          ScrapeProg/venv/bin/pip install --upgrade pip -q
          ScrapeProg/venv/bin/pip install -r ScrapeProg/requirements.txt -q

      - name: Run Pi scrapers
        env:
          proxy_username: ${{ secrets.SMARTPROXY_USERNAME }}
          proxy_password: ${{ secrets.SMARTPROXY_PASSWORD }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mkdir -p data
          PI_MAIN="BES,BandQ,CityPlumbing,DrainageOnline,DrainageSuperstore,MaterialsMarket,PlumbNation,Toolstation,Wickes,Wolseley,Jewson,Plumbworld,HeatAndPlumb,PipeKit"
          PI_STRAGGLER="PlumbingSuperstore"

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "17 11 * * *" ]; then
              PI_SUPPLIERS="$PI_STRAGGLER"
            else
              PI_SUPPLIERS="$PI_MAIN"
            fi
          else
            PI_SUPPLIERS="$PI_MAIN,$PI_STRAGGLER"
          fi

          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            FILTERED=$(python3 -c "
          only={s.strip() for s in '$ONLY'.split(',')}
          pi=set('$PI_SUPPLIERS'.split(','))
          result=only & pi
          print(','.join(result) if result else '')
          ")
            if [ -z "$FILTERED" ]; then
              echo "No Pi suppliers in --only filter — skipping"
              exit 0
            fi
            PI_SUPPLIERS="$FILTERED"
          fi
          python3 ScrapeProg/run_daily_update.py \
            --skip-import \
            --concurrency 7 \
            --results-file data/scrape_results.json \
            --only "$PI_SUPPLIERS"
      # Shutdown moved to daily_import.yml final report run — ensures all
      # per-supplier imports finish before the Optiplex powers off.
      # --concurrency 7 (was default 10) added 2026-07-22: going from 10 to 14
      # Pi suppliers kept the pool at 10 concurrent slots but caused more
      # frequent slot turnover, which pushed simultaneous outbound connection
      # attempts past the residential line's comfortable limit — 3 previously
      # rock-solid suppliers (DrainageOnline, PlumbNation, MaterialsMarket)
      # started failing with plain connection timeouts (not site blocks) the
      # same night 4 suppliers were added. Lower concurrency trades a bit of
      # wall-clock time for headroom — fine given the 12h job budget.
# ── Report job ─────────────────────────────────────────────────────────────────
# Runs after both jobs finish (or one fails). Triggers the final email report.
# always() ensures this runs even if the Pi job fails.

  report:
    needs: [scrape-cloud, scrape-pi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email report
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/DomSantan/how-much-will-that-job-cost/actions/workflows/daily_import.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"run_date\":\"$(date -u +%Y-%m-%d)\",\"scrape_run_id\":\"${{ github.run_id }}\"}}" \
          | grep -q "^204$" && echo "Email report triggered" || echo "WARNING: failed to trigger report"
