name: Daily price scrape

on:
  # 2026-09-15: the `schedule:` triggers that used to live here (00:13 main,
  # 11:17 PlumbingSuperstore straggler) are GONE, not just retimed — removing
  # them was the fix, not a stopgap. History, for whoever finds this comment
  # confused there's no cron left:
  #
  # The 00:13 cron was already known (2026-07-20, 2026-08-04) to run 2.5-4.5h
  # late under GitHub's own scheduling contention — no cron time dodged it.
  # 2026-09-06 fixed the SYMPTOM by having the Optiplex dispatch this workflow
  # itself via workflow_dispatch (run_type=main) the instant it wakes —
  # dispatched runs start near-instantly, sidestepping the schedule queue
  # entirely. That part worked and is proven (a week of ~23:30 UTC starts).
  #
  # But the two OLD schedule crons were left running "as a harmless fallback"
  # — that was wrong. Once the boot-dispatch made the main run reliable, the
  # old crons didn't stay usefully redundant, they became a THIRD trigger
  # competing for the same single Optiplex runner every single night: the
  # boot-dispatch's run_type=main at ~23:30, PLUS the old 00:13 cron (still
  # landing 4+ hours late, i.e. mid-crawl of the dispatch's own run), PLUS
  # the old 11:17 straggler cron (also still delayed). Confirmed via
  # `last reboot -F`: nightly uptimes were running 14-16h instead of the
  # ~8h20m one clean crawl needs — multiple near-duplicate crawls queueing
  # and running back-to-back on the same boot, every night. On 2026-09-13
  # this collided badly: a delayed old-schedule run got killed mid-crawl
  # (10h+ into Wolseley) by ANOTHER run's shutdown dispatch firing under it
  # — the exact shutdown-collision failure class this repo already went
  # through 4 rounds to fix (see scraper_fixes memory), just from a new
  # source. It also flooded the private repo's import pipeline with 100+
  # redundant dispatches/night from 3x the normal per-supplier import chatter.
  #
  # Fix: removed both schedule crons outright. The Optiplex's boot-dispatch
  # (run_type=main) is now the SOLE entry point into the whole night's run,
  # and the report job below chain-dispatches run_type=straggler once main
  # completes — deterministic, sequential, zero collision risk, and no
  # dependency on GitHub's schedule queue for either leg. If the boot-dispatch
  # itself ever fails to fire, nothing scrapes that night — there's no
  # schedule-based safety net anymore. That trade was deliberate: the old
  # "safety net" was actively causing data loss more often than it was
  # preventing it. Route around a failed boot-dispatch via monitoring/data-
  # freshness checks, not by resurrecting a second competing trigger.
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated scrapers to run (e.g. GrantAndStone,Wickes). Leave empty for all.'
        required: false
        default: ''
      run_type:
        description: "\"main\" = the full nightly batch except PlumbingSuperstore (fired by the Optiplex's boot-dispatch). \"straggler\" = PlumbingSuperstore only (chain-dispatched by main's own report job once it finishes — never fired directly except for testing). Leave empty for ad-hoc manual runs (includes everything, matches pre-2026-09-06 behaviour)."
        required: false
        default: ''

# ── Cloud job ──────────────────────────────────────────────────────────────────
# Runs on GitHub-hosted runners — unaffected by Pi downtime.
# Suppliers: BoilerSparesUK, DrainageCentral, DrainageFittings, Geberit,
#            PipeDreamFittings, Screwfix, VictorianPlumbing, Wavin,
#            Selco, BetterBathrooms
# Moved to Pi (rate-limit 202/blocked from cloud IPs): DrainageOnline,
#   DrainageSuperstore, PlumbingSuperstore, PipeKit, PlasticPipeShop
# Selco/BetterBathrooms added 2026-07-21 (re-added scraper, small catalogues — see run_daily_update.py)
# PipeKit moved to Pi 2026-07-23 (see below) — same cloud-IP-block pattern as the drainage trio
# PlasticPipeShop moved to Pi 2026-08-04 — same pattern, see PI_MAIN comment below

jobs:
  scrape-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 4h — longest cloud spider is BoilerSparesUK (~3-4h, varies with site speed)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Scrapy venv
        run: |
          python3 -m venv ScrapeProg/venv
          ScrapeProg/venv/bin/pip install --upgrade pip -q
          ScrapeProg/venv/bin/pip install -r ScrapeProg/requirements.txt -q

      - name: Run cloud scrapers
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_TYPE: ${{ inputs.run_type }}
        run: |
          mkdir -p data
          CLOUD_SUPPLIERS="BoilerSparesUK,DrainageCentral,DrainageFittings,Geberit,PipeDreamFittings,Screwfix,VictorianPlumbing,Wavin,Selco,BetterBathrooms"

          # The straggler run exists only for the Pi job's PlumbingSuperstore —
          # the cloud job has nothing to do on that stage.
          if [ "$RUN_TYPE" = "straggler" ]; then
            echo "Straggler run has no cloud suppliers — skipping cloud job"
            exit 0
          fi

          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            FILTERED=$(python3 -c "
          only={s.strip() for s in '$ONLY'.split(',')}
          cloud=set('$CLOUD_SUPPLIERS'.split(','))
          result=only & cloud
          print(','.join(result) if result else '')
          ")
            if [ -z "$FILTERED" ]; then
              echo "No cloud suppliers in --only filter — skipping"
              exit 0
            fi
            CLOUD_SUPPLIERS="$FILTERED"
          fi
          python3 ScrapeProg/run_daily_update.py \
            --skip-import \
            --results-file data/scrape_results.json \
            --only "$CLOUD_SUPPLIERS"

# ── Pi job ─────────────────────────────────────────────────────────────────────
# Runs on the Optiplex (residential IP). Fails gracefully if the Optiplex is down —
# cloud job above always completes independently.
# Suppliers: BES, BandQ, CityPlumbing, DrainageOnline, DrainageSuperstore,
#            MaterialsMarket, PlumbNation, Toolstation, Wickes,
#            Wolseley, Jewson, Plumbworld, HeatAndPlumb, PipeKit,
#            PlasticPipeShop  (run_type=main, the nightly boot-dispatch)
#            + PlumbingSuperstore (run_type=straggler only — see PI_STRAGGLER)
# (DrainageOnline/DrainageSuperstore/PlumbingSuperstore moved here — cloud IPs get 202)
# PlumbingSuperstore split out 2026-08-04 — its crawl fails if it lands in the
# ~03:30-04:00 UTC window a delayed main run used to land in. Originally its
# own 11:17 schedule cron; since 2026-09-15 it's chain-dispatched by the main
# run's own report job instead (see `on:` comment up top and the report job
# below) — deterministic ordering, no separate schedule/wake window needed.
# PlasticPipeShop moved here 2026-08-04 (joins the normal main run, no special
# timing needed) — same cloud-datacenter-IP-block signature as PipeKit/the
# drainage trio: instant block on request #1 from GitHub's cloud runner,
# clean from every other IP tested (curl, curl_cffi chrome133a/chrome120,
# residential) regardless of time of day. Not a timing issue like
# PlumbingSuperstore — confirmed via a manual run at 10:51 UTC that still
# failed instantly, well outside the suspect ~03:30-04:00 UTC window.
# Wolseley/Jewson/Plumbworld/HeatAndPlumb added 2026-07-21 (re-added scraper, put
# here rather than cloud since their catalogues are large — 14k-42k URLs each —
# and the cloud job's 4h ceiling is already tight at 10 concurrent suppliers;
# Pi's 12h budget already comfortably hosts the other large catalogues)
# PipeKit moved here 2026-07-23 — was failing every night on cloud with a 429 on
# its very first request (confirmed via live test: the exact same URL succeeds
# cleanly from a non-cloud IP, and continues succeeding for ~280 more requests
# before genuinely rate-limiting — the cloud runner's shared IP range is already
# blocked outright, not "trips during the crawl" like the drainage trio was).
# Same fix as the drainage trio above.

  scrape-pi:
    runs-on: [self-hosted, residential]
    timeout-minutes: 720   # 12h — CityPlumbing + Wickes are slow
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create Scrapy venv
        run: |
          python3 -m venv ScrapeProg/venv
          ScrapeProg/venv/bin/pip install --upgrade pip -q
          ScrapeProg/venv/bin/pip install -r ScrapeProg/requirements.txt -q

      - name: Run Pi scrapers
        env:
          proxy_username: ${{ secrets.SMARTPROXY_USERNAME }}
          proxy_password: ${{ secrets.SMARTPROXY_PASSWORD }}
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_TYPE: ${{ inputs.run_type }}
        run: |
          mkdir -p data
          PI_MAIN="BES,BandQ,CityPlumbing,DrainageOnline,DrainageSuperstore,MaterialsMarket,PlumbNation,Toolstation,Wickes,Wolseley,Jewson,Plumbworld,HeatAndPlumb,PipeKit,PlasticPipeShop"
          PI_STRAGGLER="PlumbingSuperstore"

          # run_type=main (the nightly boot-dispatch) → everything except the
          # straggler. run_type=straggler (chain-dispatched by main's own
          # report job once it finishes, see below) → PlumbingSuperstore only.
          # Anything else (ad-hoc manual dispatch, run_type left empty) →
          # everything combined, matching pre-2026-09-06 behaviour, so Dom's
          # existing manual-testing habits via the Actions UI don't change.
          if [ "$RUN_TYPE" = "main" ]; then
            PI_SUPPLIERS="$PI_MAIN"
          elif [ "$RUN_TYPE" = "straggler" ]; then
            PI_SUPPLIERS="$PI_STRAGGLER"
          else
            PI_SUPPLIERS="$PI_MAIN,$PI_STRAGGLER"
          fi

          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            FILTERED=$(python3 -c "
          only={s.strip() for s in '$ONLY'.split(',')}
          pi=set('$PI_SUPPLIERS'.split(','))
          result=only & pi
          print(','.join(result) if result else '')
          ")
            if [ -z "$FILTERED" ]; then
              echo "No Pi suppliers in --only filter — skipping"
              exit 0
            fi
            PI_SUPPLIERS="$FILTERED"
          fi
          python3 ScrapeProg/run_daily_update.py \
            --skip-import \
            --concurrency 7 \
            --results-file data/scrape_results.json \
            --only "$PI_SUPPLIERS"
      # Shutdown moved to daily_import.yml final report run — ensures all
      # per-supplier imports finish before the Optiplex powers off.
      # --concurrency 7 (was default 10) added 2026-07-22: going from 10 to 14
      # Pi suppliers kept the pool at 10 concurrent slots but caused more
      # frequent slot turnover, which pushed simultaneous outbound connection
      # attempts past the residential line's comfortable limit — 3 previously
      # rock-solid suppliers (DrainageOnline, PlumbNation, MaterialsMarket)
      # started failing with plain connection timeouts (not site blocks) the
      # same night 4 suppliers were added. Lower concurrency trades a bit of
      # wall-clock time for headroom — fine given the 12h job budget.
# ── Report job ─────────────────────────────────────────────────────────────────
# Runs after both jobs finish (or one fails). always() ensures this runs even
# if the Pi job fails.
#
# Two responsibilities depending on RUN_TYPE:
#   run_type=main      → chain-dispatch run_type=straggler (PlumbingSuperstore)
#                         instead of shutting down yet. Sequential, not
#                         parallel, so it can never compete with the straggler
#                         for the Optiplex runner — see `on:` comment up top
#                         for why that used to be a real problem.
#   anything else       → the REAL final step: dispatch daily_import.yml with
#                         no `supplier` input, which is what triggers that
#                         workflow's "shut down the Optiplex + schedule next
#                         rtcwake" step, plus the aggregate end-of-run email.
#                         This covers run_type=straggler (the normal end of
#                         the chain), and ad-hoc manual dispatches (which
#                         were never part of the chain to begin with).
#
# Per-supplier DB imports do NOT depend on any of this — each scraper already
# dispatches its own import inline as it finishes (see "Per-supplier import
# dispatched" in run_daily_update.py's log output).
#
# If the chain-dispatch call itself fails (transient API error), falls
# through to the real shutdown dispatch anyway rather than leaving the
# Optiplex awake indefinitely with no rtcwake alarm re-armed — PlumbingSuperstore
# just misses that one night rather than the whole cycle breaking.
#
# 2026-08-06 INCIDENT (historical): the old 11:17 straggler *schedule* used to
# fire this same job, which used to ALSO trigger a full shutdown+reschedule —
# colliding with the next night's main run grabbing the runner right after.
# That's why this job has always special-cased "is this the straggler leg" —
# same principle, now driven by RUN_TYPE instead of a schedule string since
# the schedule triggers themselves are gone (see `on:` comment).

  report:
    needs: [scrape-cloud, scrape-pi]
    if: always()
    runs-on: ubuntu-latest
    # actions:write needed for the self-repo chain-dispatch below (GITHUB_TOKEN
    # only gets read by default — see repo's default_workflow_permissions).
    # DISPATCH_PAT works fine for the cross-repo call further down since that's
    # what it was originally scoped for; it 403'd on a same-repo dispatch when
    # first tried here (2026-09-15), which is why this step uses the ambient
    # GITHUB_TOKEN for the self-dispatch instead of also widening DISPATCH_PAT.
    permissions:
      actions: write
    steps:
      - name: Chain to straggler, or trigger final report + shutdown
        env:
          RUN_TYPE: ${{ inputs.run_type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUN_TYPE" = "main" ]; then
            echo "Main run complete — chain-dispatching the straggler run (PlumbingSuperstore)."
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/DomSantan/hmwtjc-scrapers/actions/workflows/daily_scrape.yml/dispatches \
              -d "{\"ref\":\"main\",\"inputs\":{\"run_type\":\"straggler\"}}")
            if [ "$HTTP" = "204" ]; then
              echo "Straggler run dispatched — it will handle the final report + shutdown when it completes."
              exit 0
            fi
            echo "WARNING: failed to dispatch straggler run (HTTP $HTTP) — falling through to shut down now instead of leaving the Optiplex awake with no rtcwake alarm re-armed. PlumbingSuperstore will just miss tonight."
          fi

          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/DomSantan/how-much-will-that-job-cost/actions/workflows/daily_import.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"run_date\":\"$(date -u +%Y-%m-%d)\",\"scrape_run_id\":\"${{ github.run_id }}\"}}" \
          | grep -q "^204$" && echo "Email report triggered" || echo "WARNING: failed to trigger report"
